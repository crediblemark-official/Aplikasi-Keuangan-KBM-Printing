services:
  api:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: kbm-api-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - VITE_BACKUP_GAS_URL=${VITE_BACKUP_GAS_URL}
