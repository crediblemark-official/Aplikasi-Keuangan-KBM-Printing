name: Build & Release Android APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Rilis (contoh: v1.1.16)'
        required: true
        default: 'v1.1.18'
      release_name:
        description: 'Nama / Judul Rilis'
        required: false
        default: 'KBM Percetakan Android APK Release'

jobs:
  build-and-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🌐 Check API Environment
        run: |
          if [ -n "$VITE_GAS_URL" ]; then
            echo "✅ Menggunakan VITE_GAS_URL dari GitHub Secret."
          else
            echo "⚠️ Secret VITE_GAS_URL belum diset, build akan menggunakan fallback URL."
          fi

      - name: 🔨 Build Web Assets & Sync Capacitor
        run: |
          npm run cap:sync:all

      - name: 🔑 Restore Signing Keystore (dari Secret)
        env:
          KBM_KEYSTORE_B64: ${{ secrets.KBM_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -z "$KBM_KEYSTORE_B64" ]; then
            echo "::error::Secret KBM_KEYSTORE_B64 belum di-set — build release signed tidak dapat dilakukan."
            exit 1
          fi
          mkdir -p keystore
          echo "$KBM_KEYSTORE_B64" | base64 -d > keystore/kbm-release.jks
          chmod 600 keystore/kbm-release.jks
          cp keystore/kbm-release.jks apps/app1-operasional/android/app/kbm-release.jks
          cp keystore/kbm-release.jks apps/app2-owner/android/app/kbm-release.jks

      - name: 📱 Build APK App 1 - KBM Operasional (Signed Release)
        run: |
          cd apps/app1-operasional/android
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../../../build-artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../../build-artifacts/KBM-Operasional.apk
        env:
          KBM_STORE_FILE: kbm-release.jks
          KBM_STORE_PASSWORD: ${{ secrets.KBM_STORE_PASSWORD }}
          KBM_KEY_ALIAS: ${{ secrets.KBM_KEY_ALIAS }}
          KBM_KEY_PASSWORD: ${{ secrets.KBM_KEY_PASSWORD }}

      - name: 📱 Build APK App 2 - Owner Dashboard (Signed Release)
        run: |
          cd apps/app2-owner/android
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../../../build-artifacts
          cp app/build/outputs/apk/release/app-release.apk ../../../build-artifacts/KBM-Owner-Dashboard.apk
        env:
          KBM_STORE_FILE: kbm-release.jks
          KBM_STORE_PASSWORD: ${{ secrets.KBM_STORE_PASSWORD }}
          KBM_KEY_ALIAS: ${{ secrets.KBM_KEY_ALIAS }}
          KBM_KEY_PASSWORD: ${{ secrets.KBM_KEY_PASSWORD }}

      - name: 📤 Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: KBM-Android-APKs
          path: build-artifacts/*.apk
          retention-days: 30

      - name: 🏷️ Set Release Tag & Name
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="${{ github.event.inputs.release_name }} - $TAG"
          else
            TAG="${{ github.ref_name }}"
            TITLE="KBM Printing Enterprise Suite — $TAG"
          fi
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE=""
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.title }}
          draft: false
          prerelease: false
          files: |
            build-artifacts/KBM-Operasional.apk
            build-artifacts/KBM-Owner-Dashboard.apk
          body_path: ${{ steps.release_vars.outputs.notes_file }}
