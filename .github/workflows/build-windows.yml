name: Build Windows Apps (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Rilis (contoh: v1.1.6)'
        required: false
        default: 'v1.1.17'
      release_name:
        description: 'Nama / Judul Rilis'
        required: false
        default: 'KBM Percetakan Windows Desktop Release'
      publish_release:
        description: 'Publikasikan ke GitHub Releases?'
        required: true
        type: boolean
        default: true

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: bun install

      - name: 🌐 Check API Environment
        shell: bash
        run: |
          if [ -n "$VITE_GAS_URL" ]; then
            echo "✅ Menggunakan VITE_GAS_URL dari GitHub Secret."
          else
            echo "⚠️ Secret VITE_GAS_URL belum diset, build akan menggunakan fallback URL."
          fi

      - name: 🔨 Build App 1 - KBM Operasional (.exe Installer)
        run: |
          cd apps/app1-operasional
          bun run electron:build:win

      - name: 🔨 Build App 2 - KBM Owner (.exe Installer)
        run: |
          cd apps/app2-owner
          bun run electron:build:win

      - name: 📁 Collect Windows Installers
        shell: bash
        run: |
          mkdir -p build-windows
          cp apps/app1-operasional/dist-electron/*Setup*.exe build-windows/KBM-Operasional-Setup.exe || cp apps/app1-operasional/dist-electron/*.exe build-windows/KBM-Operasional-Setup.exe
          cp apps/app2-owner/dist-electron/*Setup*.exe build-windows/KBM-Owner-Dashboard-Setup.exe || cp apps/app2-owner/dist-electron/*.exe build-windows/KBM-Owner-Dashboard-Setup.exe
          ls -lh build-windows/

      - name: 📤 Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KBM-Windows-Installers
          path: build-windows/*.exe
          retention-days: 30

      - name: 🏷️ Set Release Variables
        id: release_vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="${{ github.event.inputs.release_name }} - $TAG"
          else
            TAG="${{ github.ref_name }}"
            TITLE="KBM Printing Enterprise Suite — $TAG"
          fi
          NOTES_FILE="RELEASE_NOTES_${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE=""
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true')
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.title }}
          draft: false
          prerelease: false
          files: |
            build-windows/KBM-Operasional-Setup.exe
            build-windows/KBM-Owner-Dashboard-Setup.exe
          body_path: ${{ steps.release_vars.outputs.notes_file }}
